name: bafad-research
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - scipy>=1.10
  - scikit-learn>=1.3
  - jupyterlab>=4.0
  - ipykernel
  - ipywidgets
  - tqdm
  - pip:
    - torch==2.2.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
    - torchvision==0.17.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
    - flwr[simulation]==1.8.0
    - mlflow>=2.10
    - dvc>=3.0
